global
  maxconn 4000
  log stdout format raw local0

defaults
  log     global
  mode    tcp
  option  tcplog
  timeout connect 5s
  timeout client  1m
  timeout server  1m

# Write endpoint (master)
frontend pg_write
  bind *:5432
  default_backend pg_master

backend pg_master
  mode tcp
  option httpchk GET /master
  http-check expect status 200
  default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions check
  server pg1 pg-1:5432 check port 8008
  server pg2 pg-2:5432 check port 8008
  server pg3 pg-3:5432 check port 8008

# Read endpoint (replicas)
frontend pg_read
  bind *:5433
  default_backend pg_replicas

backend pg_replicas
  mode tcp
  balance roundrobin
  option httpchk GET /replica
  http-check expect status 200
  default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions check
  server pg1 pg-1:5432 check port 8008
  server pg2 pg-2:5432 check port 8008
  server pg3 pg-3:5432 check port 8008


