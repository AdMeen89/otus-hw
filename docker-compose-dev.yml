services:
  # ==========================
  # Etcd (single node for training)
  # ==========================
  etcd:
    image: bitnami/etcd:3.5
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_NAME=etcd
    networks:
      - citus

    ports:
      - "2379:2379"

  # ==========================
  # Patroni PostgreSQL cluster (3 nodes)
  # ==========================
  pg-1:
    build: ./docker-cfg/dev
    hostname: pg-1
    environment:
      # Cluster scope & node identity
      PATRONI_NAME: pg-1
      PATRONI_SCOPE: otus_cluster
      PATRONI_LOG_LEVEL: INFO

      # DCS (etcd3)
      PATRONI_DCS: etcd
      PATRONI_ETCD3_HOSTS: etcd:2379

      # REST API
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-1:8008

      # PostgreSQL
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-1:5432
      PATRONI_POSTGRESQL_PGPARAMS: -c hot_standby=on

      # Auth
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: otus_hw
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: repl_password

      # Synchronous quorum replication
      PATRONI_SYNCHRONOUS_MODE: "true"
      PATRONI_SYNCHRONOUS_MODE_STRICT: "true"
      PATRONI_SYNCHRONOUS_NODE_COUNT: "1"

      # Minimal pg_hba to allow app/haproxy connections
      PATRONI_POSTGRESQL_PGHBA: |
        host all all 0.0.0.0/0 md5
        host replication replicator 0.0.0.0/0 md5

    volumes:
      - pg1_data:/var/lib/postgresql/data
    networks:
      - citus
    ports:
      - "8008:8008"    # patroni REST (optional)
    depends_on:
      - etcd

  pg-2:
    build: ./docker-cfg/dev
    hostname: pg-2
    environment:
      PATRONI_NAME: pg-2
      PATRONI_SCOPE: otus_cluster
      PATRONI_LOG_LEVEL: INFO
      PATRONI_DCS: etcd
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-2:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-2:5432
      PATRONI_POSTGRESQL_PGPARAMS: -c hot_standby=on
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: otus_hw
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: repl_password
      PATRONI_SYNCHRONOUS_MODE: "true"
      PATRONI_SYNCHRONOUS_MODE_STRICT: "true"
      PATRONI_SYNCHRONOUS_NODE_COUNT: "1"
      PATRONI_POSTGRESQL_PGHBA: |
        host all all 0.0.0.0/0 md5
        host replication replicator 0.0.0.0/0 md5
    volumes:
      - pg2_data:/var/lib/postgresql/data
    networks:
      - citus
    ports:
      - "8009:8008"
    depends_on:
      - etcd

  pg-3:
    build: ./docker-cfg/dev
    hostname: pg-3
    environment:
      PATRONI_NAME: pg-3
      PATRONI_SCOPE: otus_cluster
      PATRONI_LOG_LEVEL: INFO
      PATRONI_DCS: etcd
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-3:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-3:5432
      PATRONI_POSTGRESQL_PGPARAMS: -c hot_standby=on
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: otus_hw
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: repl_password
      PATRONI_SYNCHRONOUS_MODE: "true"
      PATRONI_SYNCHRONOUS_MODE_STRICT: "true"
      PATRONI_SYNCHRONOUS_NODE_COUNT: "1"
      PATRONI_POSTGRESQL_PGHBA: |
        host all all 0.0.0.0/0 md5
        host replication replicator 0.0.0.0/0 md5
    volumes:
      - pg3_data:/var/lib/postgresql/data
    networks:
      - citus
    ports:
      - "8010:8008"
    depends_on:
      - etcd

  # ==========================
  # HAProxy: stable endpoints for app
  # - 5432: write (routes to current master)
  # - 5433: read  (routes to replicas)
  # ==========================
  haproxy:
    image: haproxy:2.8
    depends_on:
      - pg-1
      - pg-2
      - pg-3
    volumes:
      - ./docker-cfg/dev/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - citus

  # ==========================
  # Redis (feed cache)
  # ==========================
  redis:
    image: redis:7-alpine
    networks:
      - citus

  # ==========================
  # Redpanda (Kafka API)
  # ==========================
  redpanda:
    image: redpandadata/redpanda:v23.3.15
    command:
      - redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M --node-id 0 --check=false --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr redpanda:9092 --pandaproxy-addr 0.0.0.0:8082 --advertise-pandaproxy-addr redpanda:8082
    ports:
      - "9092:9092"
      - "8082:8082"
    networks:
      - citus

  # ==========================
  # Feed worker (Kafka consumer)
  # ==========================
  feed-worker:
    build: .
    entrypoint: ["bash","-lc","python -m src.workers.feed_worker_main"]
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=haproxy
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=otus_hw
    depends_on:
      - redpanda
      - redis
      - haproxy
    networks:
      - citus

  # ==========================
  # Application (points to HAProxy)
  # ==========================
  app:
    build: .
    environment:
      - ENABLE_REPLICATION=true
      # Master endpoint via HAProxy
      - DB_MASTER_HOST=haproxy
      - DB_MASTER_PORT=5432
      - DB_MASTER_NAME=postgres
      - DB_MASTER_USER=postgres
      - DB_MASTER_PASSWORD=otus_hw
      # Read endpoint(s) via HAProxy (single entry through DB_SLAVES)
      - DB_SLAVES=haproxy:5433
      # Generic env for migrations (entrypoint.sh uses these)
      - DB_HOST=haproxy
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=otus_hw
      - SECRET_
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      - haproxy
      - redis
      - redpanda
      - feed-worker
    ports:
      - "8000:8000"
    networks:
      - citus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./src:/app/src

  # ==========================
  # Citus Cluster
  # ==========================
  citus-coordinator:
    build: ./docker-cfg/citus
    platform: linux/amd64
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: otus_hw
      CITUS_NODE_TYPE: coordinator
    ports:
      - "5434:5432"  # Citus Coordinator
    networks:
      - citus
    volumes:
      - citus_coordinator_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  citus-worker-1:
    build: ./docker-cfg/citus
    platform: linux/amd64
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: otus_hw
      CITUS_NODE_TYPE: worker
    networks:
      - citus
    volumes:
      - citus_worker1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  citus-worker-2:
    build: ./docker-cfg/citus
    platform: linux/amd64
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: otus_hw
      CITUS_NODE_TYPE: worker
    networks:
      - citus
    volumes:
      - citus_worker2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  citus-worker-3:
    build: ./docker-cfg/citus
    platform: linux/amd64
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: otus_hw
      CITUS_NODE_TYPE: worker
    networks:
      - citus
    volumes:
      - citus_worker3_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  citus-worker-hot1:
    build: ./docker-cfg/citus
    platform: linux/amd64
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: otus_hw
      CITUS_NODE_TYPE: worker
    networks:
      - citus
    volumes:
      - citus-worker-hot1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  citus-worker-hot2:
    build: ./docker-cfg/citus
    platform: linux/amd64
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: otus_hw
      CITUS_NODE_TYPE: worker
    networks:
      - citus
    volumes:
      - citus-worker-hot2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
  # ==========================
  # Dialogs microservice
  # ==========================
  dialogs-app:
    build:
      context: .
      dockerfile: services/dialogs/Dockerfile
    depends_on:
      redis:
        condition: service_started
      citus-coordinator:
        condition: service_healthy
    restart: on-failure
    environment:
      - SECRET_
      - DB_MASTER_URL=postgresql://postgres:otus_hw@citus-coordinator:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - HOT_PAIR_RATE_LIMIT=5
      - HOT_PAIR_WINDOW_SEC=60
      - HOT_PAIR_TTL_SEC=180
    ports:
      - "8081:8081"
    networks:
      - citus
    volumes:
      - ./services/dialogs/src:/app/src
      - ./services/dialogs/migrations:/app/migrations


  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    networks:
      - citus
    depends_on:
      - app

volumes:
  pg1_data:
  pg2_data:
  pg3_data:
  dlgms_app:
  # Citus volumes
  citus_coordinator_data:
  citus_worker1_data:
  citus_worker2_data:
  citus_worker3_data:
  citus-worker-hot1:
  citus-worker-hot2:

networks:
  patroni:
  citus:
    driver: bridge
