global
    daemon
    log stdout local0
    
defaults
    mode tcp
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    log global
    
# Web interface для мониторинга
frontend stats
    bind *:8080
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE

# Frontend для PostgreSQL (только чтение)
frontend postgres_read
    bind *:5432
    mode tcp
    default_backend postgres_read_backend

# Backend с балансировкой между слейвами
backend postgres_read_backend
    mode tcp
    balance roundrobin
    
    # Слейв серверы для чтения (упрощенная проверка)
    server postgres-slave1 postgres-slave1:5432 check port 5432 inter 5s rise 2 fall 3
    server postgres-slave2 postgres-slave2:5432 check port 5432 inter 5s rise 2 fall 3
    
    # Backup сервер - мастер (если слейвы недоступны)
    server postgres-master postgres-master:5432 check port 5432 inter 10s backup

# Дополнительный frontend для записи (напрямую на мастер)
frontend postgres_write
    bind *:5436
    mode tcp
    default_backend postgres_write_backend

backend postgres_write_backend
    mode tcp
    server postgres-master postgres-master:5432 check port 5432 inter 5s 
