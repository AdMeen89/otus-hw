[project]
name = "otus_hw"
version = "0.1.0"
description = "Homework for the course Highload Architect"
authors = [
    { name = "AdMeen89", email = "AdMeen89@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "greenlet>=2.0.2",
    "sqlalchemy>=2.0.31",
    "asyncpg>=0.29.0",
    "yoyo-migrations>=6.3.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.5.2",
    "pyjwt>=2.10.0",
    "bcrypt>=4.0.1",
    "faker>=24.1.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"